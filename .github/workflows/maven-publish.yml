name: Publish to Maven Central

# Runs on version tag pushes (e.g. v1.4.0), same trigger as the npm publish so a
# single tag releases both halves of the lockstepped version (see CONTEXT.md).
#
# Setup: add these repository secrets (Settings -> Secrets -> Actions):
#   MAVEN_CENTRAL_USERNAME  - Central Portal user token name
#   MAVEN_CENTRAL_PASSWORD  - Central Portal user token password
#   GPG_PRIVATE_KEY         - ASCII-armoured private key (gpg --armor --export-secret-keys <keyid>)
#   GPG_PASSPHRASE          - passphrase for that key
#
# Signing uses a dedicated CI release key rather than anyone's personal key, so it
# can be rotated or revoked on its own:
#
#   key    F010998B21DEAAE59D7C33E9D219960022074EFC  (ed25519, expires 2028-08-12)
#   uid    Event Connectors Release Signing (ff-model CI) <info@eventconnectors.nl>
#   public half published to keyserver.ubuntu.com, which is how Central validates
#   the signatures - a key it cannot fetch fails the release.
#
# central-publishing-maven-plugin runs with autoPublish=true: a successful upload
# goes live without a portal approval step, and there is no undo. Central also
# rejects re-uploading an existing version, hence the version guard below.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      # pom.xml <version> is what actually gets released; the tag is only a label.
      # Fail loudly on drift rather than publishing an unexpected version.
      - name: Check tag matches pom version
        if: github.ref_type == 'tag'
        run: |
          pom_version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pom=$pom_version tag=$tag_version"
          if [ "$pom_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $pom_version"
            exit 1
          fi

      # MAVEN_GPG_PASSPHRASE is maven-gpg-plugin's documented env var
      # (gpg.passphraseEnvName): the passphrase reaches gpg over a loopback
      # pinentry, so signing needs no tty and -B is safe. Do not switch this to
      # -Dgpg.passphrase=, which is deprecated for leaking the value into argv.
      - name: Deploy to Maven Central
        run: mvn -B deploy -Dgpg.keyname=F010998B21DEAAE59D7C33E9D219960022074EFC
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
