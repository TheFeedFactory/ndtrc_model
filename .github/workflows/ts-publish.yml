name: Publish to npm

# Runs on version tag pushes (e.g. v1.2.1, v2.0.0-beta.1). workflow_dispatch
# exists to publish a version whose tag predates this workflow, such as v1.4.0.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: ts

# Authentication is npm trusted publishing (OIDC), the migration CONTEXT.md calls
# for - there is no NPM_TOKEN. The runner exchanges its GitHub OIDC token for a
# short-lived npm credential, so nothing long-lived is stored in this repo.
#
# Setup, once, on npmjs.com: @eventconnectors/ndtrc_model -> Settings ->
# Trusted publisher -> GitHub Actions, with
#   organization/repository  TheFeedFactory/ndtrc_model
#   workflow filename        ts-publish.yml
# Leave the environment field empty unless this job gains an `environment:` key -
# npm matches it exactly and rejects the publish on a mismatch.
#
# id-token: write is what lets the runner mint that OIDC token; without it the
# publish falls back to looking for a token and fails.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url: it makes setup-node write an .npmrc holding
      # _authToken=${NODE_AUTH_TOKEN} and always-auth=true, and export
      # NODE_AUTH_TOKEN as the placeholder XXXXX-XXXXX-XXXXX-XXXXX. npm then
      # authenticates with that junk token and never tries OIDC, failing with a
      # misleading "E404 ... PUT" from the registry. The default registry is
      # registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10, which has no
      # OIDC support and would fail looking for a token instead.
      - name: Install an npm that can do OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A configured authToken silently wins over OIDC, and the resulting failure
      # looks like a permissions problem rather than a config problem. Catch it here.
      - name: Check no registry token shadows OIDC
        run: |
          token="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)"
          case "$token" in
            ""|undefined|null) echo "No authToken configured - OIDC can proceed." ;;
            *) echo "::error::An npm authToken is configured, so npm will skip OIDC. Remove registry-url / NODE_AUTH_TOKEN."; exit 1 ;;
          esac
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:-<unset>}"

      # No --provenance flag and no NODE_AUTH_TOKEN: trusted publishing attaches a
      # provenance statement by itself.
      - run: npm publish --access public
