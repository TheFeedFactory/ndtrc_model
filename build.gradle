// Local/IDE build only. The published artifact (nl.eventconnectors.ff:ff-model) is built and
// released from pom.xml by .github/workflows/maven-publish.yml; keep the dependencies here in
// step with the pom.
plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.slf4j:slf4j-api:2.0.17")
    implementation('joda-time:joda-time:2.14.0')
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-joda:2.19.0')
    testImplementation("org.junit.jupiter:junit-jupiter:5.12.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}
